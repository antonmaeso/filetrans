spring:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # don't auto-run jobs on startup
      repository:
        type: jdbc


  datasource:
    url: jdbc:h2:file:./.h2/filetrans-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-drop-h2.sql,classpath:org/springframework/batch/core/schema-h2.sql

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llava:7b

logging:
  level:
    com.ant.filetrans: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info # (works once actuator starter is added)
